<mat-card>
  <mat-card-title>Credit Account</mat-card-title>
  <mat-card-content>
    <form [formGroup]="creditForm" (ngSubmit)="onSubmit()">
      <!-- Account Number Field -->
      <mat-form-field appearance="fill">
        <mat-label>Account Number</mat-label>
        <input matInput placeholder="Enter account number" formControlName="accountNumber" required >
        <mat-error *ngIf="creditForm.get('accountNumber')?.hasError('required')">
          Account number is required
        </mat-error>
      </mat-form-field>

      <!-- Credit Amount Field -->
      <mat-form-field appearance="fill">
        <mat-label>Credit Amount</mat-label>
        <input matInput type="number" placeholder="Enter credit amount" formControlName="creditAmount" required>
        <mat-error *ngIf="creditForm.get('creditAmount')?.hasError('required')">
          Credit amount is required
        </mat-error>
        <mat-error *ngIf="creditForm.get('creditAmount')?.hasError('min')">
          Credit amount must be at least 1
        </mat-error>
      </mat-form-field>

      <!-- Submit Button -->
      <button mat-raised-button color="primary" type="submit">Submit</button>
    </form>

    <!-- Success Message -->
    <div *ngIf="successMessage" class="success-message">
      {{ successMessage }}
    </div>
  </mat-card-content>
</mat-card>
